<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | ANSORION</title>
<meta name="theme-color" content="#121827">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=4">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main>
  <div class="page-head"><div class="wrap"><div class="crumbs"><a href="/">Home</a> / Shop</div><h1 id="shopTitle">Shop all</h1></div></div>
  <div class="wrap" style="padding-block:24px 70px">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="tool-right">
        <label class="sr" for="q">Search products</label>
        <input class="input search-in" id="q" type="search" placeholder="Search tees, hoodies…">
        <label class="sr" for="sort">Sort</label>
        <select class="input" id="sort" style="width:auto">
          <option value="">Featured</option><option value="new">Newest</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option>
        </select>
      </div>
    </div>
    <div class="result-count" id="count"></div>
    <div class="pgrid" id="grid">
      <div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="/assets/app.js?v=4"></script>
</body>
</html>
