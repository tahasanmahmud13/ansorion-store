<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices | ANSORION Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
  :root{--ink:#141A28;--muted:#5E6577;--line:#D9DCE3;--mist:#F4F5F8;--night:#121827;--gold:#9A7A43;--gold-soft:#D2BC8E;--bg:#E9EBF0}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.45 Manrope,"Hind Siliguri",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .bar{position:sticky;top:0;z-index:5;background:var(--night);color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px}
  .bar b{font-size:15px}.bar span{color:#A9AFBF;font-size:13px}
  .bar .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 16px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:700 13.5px Manrope,sans-serif;cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--night)}
  .btn[disabled]{opacity:.55;cursor:wait}
  .msg{max-width:600px;margin:40px auto;background:#fff;border-radius:12px;padding:24px;text-align:center}
  .pages{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 12px 60px}
  /* An A4 sheet at 96 dpi: 794 x 1123 px, three invoices of 1/3 height each. */
  .sheet{width:794px;height:1123px;background:#fff;box-shadow:0 6px 24px rgba(10,14,24,.18);display:grid;grid-template-rows:repeat(3,1fr);overflow:hidden;flex:none}
  .slip{position:relative;padding:18px 30px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .slip+.slip{border-top:1.5px dashed #9AA0AE}
  .slip+.slip::before{content:"✂";position:absolute;top:-11px;left:10px;background:#fff;color:#8A90A0;font-size:14px;line-height:20px;padding:0 4px}
  .slip.blank{background:repeating-linear-gradient(135deg,#fff 0 12px,#FAFAFB 12px 24px)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--night);padding-bottom:9px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{height:40px;width:auto}
  .brand small{display:block;color:var(--muted);font-size:10.5px;line-height:1.35}
  .inv{text-align:right}
  .inv h2{margin:0;font:800 17px/1 Manrope,sans-serif;letter-spacing:.24em}
  .inv .no{font-weight:800;font-size:13.5px;margin-top:5px;letter-spacing:.04em}
  .inv .dt{color:var(--muted);font-size:11px}
  .mid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .lbl{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .cust b{font-size:13.5px}
  .cust div,.pay div{font-size:12px}
  .addr{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:800;padding:4px 6px;background:var(--mist)}
  td{padding:4px 6px;border-bottom:1px solid #ECEEF2;vertical-align:top}
  .r{text-align:right}.c{text-align:center}
  td.nm{max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more td{color:var(--muted);font-style:italic}
  .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .note{font-size:10.5px;color:var(--muted);max-width:330px}
  .note b{color:var(--ink)}
  .tot{min-width:230px;font-size:12px}
  .tot div{display:flex;justify-content:space-between;gap:20px}
  .tot .grand{font-weight:800;font-size:14px;border-top:1px solid var(--ink);margin-top:3px;padding-top:3px}
  .tot div.collect{margin-top:5px;background:var(--night);color:#fff;border-radius:6px;padding:5px 9px;font-weight:800;font-size:13.5px}
  .tot div.collect.paid{background:#E6F3EC;color:#2E7D5B}
  .tight table{font-size:10.5px}.tight td,.tight th{padding:2px 6px}
  .tight .mid{gap:14px}.tight .top{padding-bottom:7px}
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    .bar{display:none}
    .pages{padding:0;gap:0;display:block}
    .sheet{box-shadow:none;page-break-after:always;break-after:page;width:210mm;height:297mm}
  }
</style>
</head>
<body>
  <div class="bar"><div><b>Invoices</b> <span id="info">Loading…</span></div>
    <div class="acts"><a class="btn" href="/admin#orders">← Back to orders</a><button class="btn" id="printBtn" type="button" disabled>Print</button><button class="btn primary" id="pdfBtn" type="button" disabled>Download PDF</button></div></div>
  <div class="msg" id="msg" hidden></div>
  <div class="pages" id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/admin/invoices.js?v=10"></script>
</body>
</html>
